<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAILWAY RANK MITRA</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:15px;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033;
}

.container{max-width:700px;margin:auto}

header{
  background:#102b59;
  color:white;
  text-align:center;
  padding:22px 10px;
  border-radius:12px;
  margin-bottom:15px;
}

header h1{margin:0;font-size:25px}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 2px 8px #00000012;
}

h2{font-size:19px;color:#102b59;margin-top:0}

label{
  display:block;
  margin-top:14px;
  font-weight:bold;
  font-size:14px;
}

input,textarea,select{
  display:block;
  width:100%;
  min-height:46px;
  padding:12px;
  margin-top:7px;
  border:1px solid #94a3b8;
  border-radius:8px;
  font-size:16px;
  background-color:#ffffff;
  color:#172033;
}

select{
  appearance:auto;
  -webkit-appearance:menulist;
  cursor:pointer;
}

button{
  width:100%;
  border:0;
  padding:14px;
  margin-top:17px;
  border-radius:8px;
  color:white;
  background:#1266d4;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

textarea{min-height:120px;resize:vertical}

#result{
  display:none;
  background:#e8f5e9;
  padding:15px;
  border-radius:8px;
  margin-top:15px;
  overflow-wrap:anywhere;
}

#status{margin-top:10px;font-size:14px;overflow-wrap:anywhere}

footer{text-align:center;color:#64748b;font-size:12px;padding:12px}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>🚆 RAILWAY RANK MITRA</h1>
</header>

<section class="card">
  <h2>Candidate Details</h2>

  <label for="candidateName">Candidate Name</label>
  <input id="candidateName" type="text">

  <label for="rollNumber">Roll Number / Registration Number</label>
  <input id="rollNumber" type="text">

  <label for="examName">Select Exam ▼</label>
  <select id="examName">
    <option value="">-- Select Exam --</option>
    <option value="RRB ALP">RRB ALP</option>
    <option value="RRB Technician">RRB Technician</option>
    <option value="RRB Group D">RRB Group D</option>
    <option value="RRB NTPC Graduate">RRB NTPC Graduate</option>
    <option value="RRB NTPC Undergraduate">RRB NTPC Undergraduate</option>
    <option value="RRB JE">RRB JE</option>
    <option value="RRB Paramedical">RRB Paramedical</option>
    <option value="GDCE ALP">GDCE ALP</option>
    <option value="GDCE Technician">GDCE Technician</option>
    <option value="GDCE Goods Guard / Train Manager">GDCE Goods Guard / Train Manager</option>
    <option value="GDCE Station Master">GDCE Station Master</option>
    <option value="GDCE CCTC">GDCE CCTC</option>
    <option value="GDCE JE">GDCE JE</option>
    <option value="LDCE ALP">LDCE ALP</option>
    <option value="LDCE Technician">LDCE Technician</option>
    <option value="LDCE Goods Guard / Train Manager">LDCE Goods Guard / Train Manager</option>
    <option value="LDCE Station Master">LDCE Station Master</option>
    <option value="LDCE CCTC">LDCE CCTC</option>
    <option value="LDCE Shunting Master">LDCE Shunting Master</option>
    <option value="Other">Other Railway Exam</option>
  </select>

  <label for="zone">Select Railway Zone ▼</label>
  <select id="zone">
    <option value="">-- Select Railway Zone --</option>
    <option value="CR">Central Railway (CR)</option>
    <option value="ER">Eastern Railway (ER)</option>
    <option value="ECR">East Central Railway (ECR)</option>
    <option value="ECoR">East Coast Railway (ECoR)</option>
    <option value="NR">Northern Railway (NR)</option>
    <option value="NCR">North Central Railway (NCR)</option>
    <option value="NER">North Eastern Railway (NER)</option>
    <option value="NFR">Northeast Frontier Railway (NFR)</option>
    <option value="NWR">North Western Railway (NWR)</option>
    <option value="SR">Southern Railway (SR)</option>
    <option value="SCR">South Central Railway (SCR)</option>
    <option value="SER">South Eastern Railway (SER)</option>
    <option value="SECR">South East Central Railway (SECR)</option>
    <option value="SWR">South Western Railway (SWR)</option>
    <option value="WR">Western Railway (WR)</option>
    <option value="WCR">West Central Railway (WCR)</option>
    <option value="Metro Railway Kolkata">Metro Railway Kolkata</option>
    <option value="Other">Other Railway Unit</option>
  </select>

  <label for="examDate">Exam Date</label>
  <input id="examDate" type="date">

  <label for="shift">Select Shift ▼</label>
  <select id="shift">
    <option value="">-- Select Shift --</option>
    <option value="First Shift">First Shift</option>
    <option value="Second Shift">Second Shift</option>
    <option value="Third Shift">Third Shift</option>
    <option value="Fourth Shift">Fourth Shift</option>
  </select>

  <label for="category">Select Category ▼</label>
  <select id="category">
    <option value="">-- Select Category --</option>
    <option value="UR">UR</option>
    <option value="OBC">OBC</option>
    <option value="SC">SC</option>
    <option value="ST">ST</option>
    <option value="EWS">EWS</option>
  </select>

  <button type="button" onclick="saveDetails()">Save Candidate Details</button>
</section>

<section class="card">
  <h2>Official Answer Key</h2>

  <label for="answerFile">Upload Answer Key HTML File</label>
  <input id="answerFile" type="file" accept=".html,.htm">

  <label for="answerUrl">Answer Key URL</label>
  <input id="answerUrl" type="url">

  <label for="candidateAnswers">Candidate Answers</label>
  <textarea id="candidateAnswers"></textarea>

  <button type="button" onclick="calculateScore()">Calculate Score</button>

  <div id="status"></div>
  <div id="result"></div>
</section>

<footer>RAILWAY RANK MITRA</footer>
</div>

<script>
const POSITIVE_MARKS = 1;
const NEGATIVE_MARKS = 0.33;

function saveDetails(){
  const details = {
    name: document.getElementById("candidateName").value,
    roll: document.getElementById("rollNumber").value,
    exam: document.getElementById("examName").value,
    zone: document.getElementById("zone").value,
    date: document.getElementById("examDate").value,
    shift: document.getElementById("shift").value,
    category: document.getElementById("category").value
  };

  localStorage.setItem("rrmCandidateDetails", JSON.stringify(details));
  document.getElementById("status").textContent = "Details saved.";
}

function parseAnswers(text){
  const answers = {};
  text.split(/\n|,/).forEach(line => {
    const match = line.trim().match(/(?:Q(?:uestion)?\s*)?(\d+)\s*[-:=.)]\s*([A-E])/i);
    if(match) answers[Number(match[1])] = match[2].toUpperCase();
  });
  return answers;
}

function parseAnswerKey(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const key = {};

  doc.querySelectorAll("tr").forEach(row => {
    const cells = Array.from(row.querySelectorAll("th,td"))
      .map(cell => cell.innerText.trim());

    if(cells.length < 2) return;

    const q = cells.find(value => /^\d+$/.test(value));
    const a = cells.find(value => /^[A-E]$/i.test(value));

    if(q && a) key[Number(q)] = a.toUpperCase();
  });

  return key;
}

async function calculateScore(){
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  status.textContent = "";
  result.style.display = "none";

  const candidateText = document.getElementById("candidateAnswers").value.trim();

  if(!candidateText){
    status.textContent = "Answers required";
    return;
  }

  const file = document.getElementById("answerFile").files[0];
  const url = document.getElementById("answerUrl").value.trim();
  let html = "";

  try{
    if(file){
      html = await file.text();
    }else if(url){
      const response = await fetch(url);
      if(!response.ok) throw new Error();
      html = await response.text();
    }else{
      status.textContent = "Answer key required";
      return;
    }

    const correctAnswers = parseAnswerKey(html);
    const candidateAnswers = parseAnswers(candidateText);
    const questions = Object.keys(correctAnswers);

    if(!questions.length){
      status.textContent = "Answer key format not supported";
      return;
    }

    let correct = 0, wrong = 0, unanswered = 0;

    questions.forEach(question => {
      const selected = candidateAnswers[Number(question)];
      if(!selected) unanswered++;
      else if(selected === correctAnswers[question]) correct++;
      else wrong++;
    });

    const score = correct * POSITIVE_MARKS - wrong * NEGATIVE_MARKS;

    result.innerHTML = `
      <h2>Score Result</h2>
      <p><strong>Total Questions:</strong> ${questions.length}</p>
      <p><strong>Correct:</strong> ${correct}</p>
      <p><strong>Wrong:</strong> ${wrong}</p>
      <p><strong>Unanswered:</strong> ${unanswered}</p>
      <p><strong>Score:</strong> ${score.toFixed(2)}</p>
    `;
    result.style.display = "block";

  }catch(error){
    status.textContent = "Answer key unavailable";
  }
}

window.addEventListener("load", function(){
  const saved = localStorage.getItem("rrmCandidateDetails");
  if(!saved) return;

  try{
    const d = JSON.parse(saved);
    document.getElementById("candidateName").value = d.name || "";
    document.getElementById("rollNumber").value = d.roll || "";
    document.getElementById("examName").value = d.exam || "";
    document.getElementById("zone").value = d.zone || "";
    document.getElementById("examDate").value = d.date || "";
    document.getElementById("shift").value = d.shift || "";
    document.getElementById("category").value = d.category || "";
  }catch(e){}
});
</script>
</body>
</html>

<script>
function showPage(id, button) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    button.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[c]));
}

document.getElementById('candidateForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const fields = [
        ['Candidate Name', 'candidateName'],
        ['Registration Number', 'regNo'],
        ['Exam Type', 'examType'],
        ['Exam Post', 'examPost'],
        ['Railway Zone', 'zone'],
        ['Exam Date', 'examDate'],
        ['Shift', 'shift'],
        ['Category', 'category']
    ];

    const result = document.getElementById('candidateResult');

    result.innerHTML =
        '<h3>👤 Candidate Details</h3>' +
        '<table>' +
        fields.map(([label, id]) =>
            '<tr><th>' + label + '</th><td>' +
            esc(document.getElementById(id).value) +
            '</td></tr>'
        ).join('') +
        '</table>' +

        '<h3>📊 Candidate Score Board</h3>' +
        '<p id="candidateScoreMessage">' +
        'सही स्कोर देखने के लिए नीचे दिए गए Calculator में Official Answer Key और Candidate Response Sheet दोनों अपलोड करें।' +
        '</p>' +

        '<div id="candidateScoreBoard"></div>' +

        '<button type="button" class="primary" onclick="showCalculator()">' +
        'UPLOAD ANSWER KEY & CALCULATE SCORE' +
        '</button>';

    result.classList.remove('hidden');
    result.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

function showCalculator() {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));

    document.getElementById('ldce').classList.remove('hidden');

    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('nav button')[1].classList.add('active');

    document.getElementById('ldceName').value =
        document.getElementById('candidateName').value;

    document.getElementById('ldceZone').value =
        document.getElementById('zone').value;

    document.getElementById('ldcePost').value =
        document.getElementById('examPost').value;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function readRows(file) {
    if (!file) {
        throw Error('Official Answer Key और Candidate Response Sheet दोनों अपलोड करें।');
    }

    const text = await file.text();

    if (file.name.toLowerCase().endsWith('.json')) {
        const data = JSON.parse(text);

        if (Array.isArray(data)) return data;
        if (Array.isArray(data.questions)) return data.questions;

        throw Error('JSON में प्रश्नों की सूची नहीं मिली।');
    }

    const lines = text.trim().split(/\r?\n/);

    if (lines.length < 2) {
        throw Error('CSV में पर्याप्त डेटा नहीं है।');
    }

    const parse = line =>
        line.split(',').map(x => x.trim().replace(/^"|"$/g, ''));

    const heads = parse(lines[0]);

    return lines.slice(1).filter(Boolean).map(line => {
        const vals = parse(line);
        const obj = {};

        heads.forEach((h, i) => {
            obj[h] = vals[i] || '';
        });

        return obj;
    });
}

function field(r, names) {
    for (const n of names) {
        if (r[n] !== undefined && String(r[n]).trim() !== '') {
            return String(r[n]).trim();
        }
    }

    return '';
}

async function calculateScore() {
    const error = document.getElementById('scoreError');
    const out = document.getElementById('scoreResult');
    const dl = document.getElementById('downloadSection');

    error.classList.add('hidden');
    out.classList.add('hidden');
    dl.classList.add('hidden');

    try {
        const key = await readRows(document.getElementById('keyFile').files[0]);
        const response = await readRows(document.getElementById('responseFile').files[0]);

        const keys = new Map();
        const answers = new Map();

        key.forEach(r => {
            const id = field(r, ['id', 'ID', 'questionId', 'question_id']);
            const a = field(r, ['correctAnswer', 'correct_answer', 'answerKey']);

            if (id && a) keys.set(id, a.toUpperCase());
        });

        response.forEach(r => {
            const id = field(r, ['id', 'ID', 'questionId', 'question_id']);
            const a = field(r, [
                'candidateAnswer',
                'candidate_answer',
                'selectedAnswer',
                'response',
                'answer'
            ]);

            if (id) answers.set(id, a.toUpperCase());
        });

        if (!keys.size || !answers.size) {
            throw Error('फ़ाइलों में प्रश्न ID और उत्तर नहीं पढ़े जा सके।');
        }

        const missing = [...keys.keys()].filter(id => !answers.has(id));

        if (missing.length) {
            throw Error(
                missing.length +
                ' प्रश्नों के उत्तर Response Sheet में नहीं मिले। स्कोर नहीं निकाला गया।'
            );
        }

        let correct = 0;
        let wrong = 0;
        let unattempted = 0;

        for (const [id, k] of keys) {
            const a = answers.get(id);

            if (!a || a === '-' || a === 'N/A') {
                unattempted++;
            } else if (a === k) {
                correct++;
            } else {
                wrong++;
            }
        }

        const total = keys.size;
        const attempted = correct + wrong;

        const positive = Number(document.getElementById('positive').value);
        const negative = Number(document.getElementById('negative').value);

        if (
            !Number.isFinite(positive) ||
            !Number.isFinite(negative) ||
            positive < 0 ||
            negative < 0
        ) {
            throw Error('Marks की वैल्यू सही भरें।');
        }

        const score = correct * positive - wrong * negative;
        const maximum = total * positive;
        const percentage = maximum ? score / maximum * 100 : 0;
        const accuracy = attempted ? correct / attempted * 100 : 0;

        const candidateName =
            document.getElementById('candidateName').value ||
            document.getElementById('ldceName').value ||
            '—';

        const boardHTML =
            '<h3>📊 Candidate Score Board</h3>' +
            '<table>' +
            '<tr><th>विवरण</th><th>परिणाम</th></tr>' +
            '<tr><td>Total Questions</td><td>' + total + '</td></tr>' +
            '<tr><td>Attempted</td><td>' + attempted + '</td></tr>' +
            '<tr><td>Correct Answers</td><td>' + correct + '</td></tr>' +
            '<tr><td>Wrong Answers</td><td>' + wrong + '</td></tr>' +
            '<tr><td>Unattempted</td><td>' + unattempted + '</td></tr>' +
            '<tr><td>Total Score</td><td>' +
            score.toFixed(2) + ' / ' + maximum.toFixed(2) +
            '</td></tr>' +
            '<tr><td>Percentage</td><td>' + percentage.toFixed(2) + '%</td></tr>' +
            '<tr><td>Accuracy</td><td>' + accuracy.toFixed(2) + '%</td></tr>' +
            '</table>' +
            '<p class="note">यह स्कोर अपलोड की गई फ़ाइलों और आपके चुने हुए marking scheme पर आधारित है। यह आधिकारिक RRB स्कोरकार्ड नहीं है।</p>';

        out.innerHTML =
            '<h2>🚆 RAILWAY RANK MITRA SCORE CARD</h2>' +
            '<p><b>Candidate:</b> ' + esc(candidateName) + '</p>' +
            boardHTML;

        out.classList.remove('hidden');
        dl.classList.remove('hidden');

        /*
         * Candidate Details के ठीक नीचे भी वही calculated score दिखाएँ।
         */
        const candidateBoard = document.getElementById('candidateScoreBoard');
        const candidateMessage = document.getElementById('candidateScoreMessage');

        if (candidateBoard) {
            candidateBoard.innerHTML = boardHTML;
        }

        if (candidateMessage) {
            candidateMessage.textContent = 'आपका स्कोर सफलतापूर्वक Calculate हो गया है।';
        }

        out.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (e) {
        error.textContent = 'Calculation नहीं हुई: ' + e.message;
        error.classList.remove('hidden');

        const candidateBoard = document.getElementById('candidateScoreBoard');
        const candidateMessage = document.getElementById('candidateScoreMessage');

        if (candidateBoard) candidateBoard.innerHTML = '';

        if (candidateMessage) {
            candidateMessage.textContent =
                'स्कोर अभी उपलब्ध नहीं है। दोनों फ़ाइलें सही अपलोड करके Calculate करें।';
        }
    }
}

function predictRank() {
    const total = Number(document.getElementById('totalCandidates').value);
    const pct = document.getElementById('rankPercentile').value;
    const out = document.getElementById('rankResult');

    if (!total || total < 1) {
        alert('Total Candidates भरें।');
        return;
    }

    if (pct === '' || Number(pct) < 0 || Number(pct) > 100) {
        alert('Percentile 0 से 100 के बीच भरें।');
        return;
    }

    const rank = Math.max(
        1,
        Math.ceil(total * (1 - Number(pct) / 100))
    );

    out.innerHTML =
        '<h3>Estimated Rank: ' + rank.toLocaleString('en-IN') + '</h3>' +
        '<p>Marks: ' +
        esc(document.getElementById('rankMarks').value || '—') +
        '</p>' +
        '<p>Percentile: ' + Number(pct) + '%</p>' +
        '<p>यह अनुमान है, आधिकारिक रैंक नहीं।</p>';

    out.classList.remove('hidden');
}
</script>

<!DOCTYPE html><html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAILWAY RANK MITRA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#172033}
header{background:linear-gradient(135deg,#102b68,#0878cb);color:#fff;text-align:center;padding:24px 12px}
header h1{margin:0;font-size:27px}
main{max-width:760px;margin:20px auto;padding:0 12px}
.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 3px 12px #0001}
h2{color:#123879;margin-top:0}
label{display:block;font-weight:bold;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff}
button{width:100%;padding:13px;border:0;border-radius:9px;color:#fff;background:#075fc5;font-size:16px;font-weight:bold;margin-top:14px}
.save{background:#16804a}
#message{margin-top:12px;color:#b91c1c;overflow-wrap:anywhere}
#result{display:none;background:#e8f8ee;border-radius:10px;padding:15px;margin-top:15px;line-height:1.9;overflow-wrap:anywhere}
</style>
</head>
<body><header>
<h1>🚆 RAILWAY RANK MITRA</h1>
</header><main>
<section class="card">
<h2>Candidate Details</h2><label for="name">Candidate Name</label>
<input id="name">

<label for="roll">Roll Number / Registration Number</label>
<input id="roll">

<label for="exam">Exam Name</label>
<select id="exam">

<option value="">Select Exam</option>
<option>RRB Group D</option>
<option>RRB ALP</option>
<option>RRB Technician</option>
<option>RRB NTPC</option>
<option>RRB JE</option>
<option>GDCE</option>
<option>LDCE</option>
<option>Other Railway Exam</option>
</select><label for="zone">Railway Zone</label>
<input id="zone">

<label for="date">Exam Date</label>
<input id="date" type="date">

<label for="shift">Exam Shift</label>
<select id="shift">

<option value="">Select Shift</option>
<option>First Shift</option>
<option>Second Shift</option>
<option>Third Shift</option>
<option>Fourth Shift</option>
</select><label for="category">Category</label>
<select id="category">

<option value="">Select Category</option>
<option>UR</option>
<option>OBC</option>
<option>SC</option>
<option>ST</option>
<option>EWS</option>
</select><button class="save" type="button" onclick="saveCandidate()">Save Candidate Details</button>

<hr style="margin-top:24px"><h2>Official Answer Key</h2><label for="answerFile">Upload Answer Key</label>
<input id="answerFile" type="file" accept=".html,.htm">

<label for="answerURL">Answer Key URL</label>
<input id="answerURL" type="url">

<label for="answers">Candidate Answers</label>

<textarea id="answers" rows="5"></textarea><button type="button" onclick="calculateScore()">Calculate Score</button>

<div id="message" role="status"></div>
<div id="result" aria-live="polite"></div>
</section>
</main><script>
const POSITIVE_MARKS=1;
const NEGATIVE_MARKS=0.33;
const el=id=>document.getElementById(id);

function saveCandidate(){
  const data={
    name:el("name").value,
    roll:el("roll").value,
    exam:el("exam").value,
    zone:el("zone").value,
    date:el("date").value,
    shift:el("shift").value,
    category:el("category").value
  };
  try{
    localStorage.setItem("rrmCandidate",JSON.stringify(data));
    el("message").style.color="green";
    el("message").textContent="Saved";
  }catch(e){
    el("message").textContent="Save failed";
  }
}

function loadCandidate(){
  try{
    const data=JSON.parse(localStorage.getItem("rrmCandidate")||"{}");
    Object.keys(data).forEach(k=>{if(el(k))el(k).value=data[k]});
  }catch(e){}
}

function norm(v){
  return String(v||"").trim().toUpperCase().replace(/\s+/g," ");
}

function parseAnswers(text){
  const out={};
  text.split(/[\n,;]+/).forEach(part=>{
    const m=part.trim().match(/^(\d+)\s*[:=\-]\s*(.+)$/);
    if(m)out[m[1]]=norm(m[2]);
  });
  return out;
}

function extractKey(html){
  const doc=new DOMParser().parseFromString(html,"text/html");

  for(const table of doc.querySelectorAll("table")){
    const rows=[...table.querySelectorAll("tr")];
    if(rows.length<2)continue;

    const headers=[...rows[0].querySelectorAll("th,td")].map(c=>norm(c.textContent));
    const qi=headers.findIndex(h=>/QUESTION.*(ID|NO|NUMBER)|^QUESTION$|^QUES$/.test(h));
    const ai=headers.findIndex(h=>/CORRECT.*ANSWER|OFFICIAL.*ANSWER|RIGHT.*ANSWER|CORRECT.*OPTION/.test(h));
    if(qi<0||ai<0)continue;

    const key={};
    rows.slice(1).forEach(row=>{
      const cells=[...row.querySelectorAll("th,td")];
      if(!cells[qi]||!cells[ai])return;
      const q=cells[qi].textContent.match(/\d+/);
      const a=norm(cells[ai].textContent);
      if(q&&a)key[q[0]]=a;
    });

    if(Object.keys(key).length)return key;
  }
  throw new Error("Answer key format not supported");
}

async function getKeyHTML(){
  const file=el("answerFile").files[0];
  if(file)return await file.text();

  const url=el("answerURL").value.trim();
  if(!url)throw new Error("Answer key required");

  const response=await fetch(url);
  if(!response.ok)throw new Error("Answer key unavailable");
  return await response.text();
}

async function calculateScore(){
  el("message").textContent="";
  el("result").style.display="none";

  try{
    const user=parseAnswers(el("answers").value);
    if(!Object.keys(user).length)throw new Error("Answers required");

    const key=extractKey(await getKeyHTML());
    let correct=0,wrong=0,unanswered=0;

    Object.keys(key).forEach(q=>{
      if(!user[q])unanswered++;
      else if(user[q]===norm(key[q]))correct++;
      else wrong++;
    });

    const score=correct*POSITIVE_MARKS-wrong*NEGATIVE_MARKS;

    el("result").innerHTML=
      "<h3>Score Result</h3>"+
      "Total Questions: "+Object.keys(key).length+"<br>"+
      "Correct Answers: "+correct+"<br>"+
      "Wrong Answers: "+wrong+"<br>"+
      "Unanswered: "+unanswered+"<hr>"+
      "<strong>Final Score: "+score.toFixed(2)+"</strong>";

    el("result").style.display="block";
  }catch(e){
    el("message").textContent=e.message;
  }
}

loadCandidate();
</script></body>
</html>

<section class="card">
  <h2>📝 Candidate Details</h2>

  <form id="scoreForm">

    <!-- URL सबसे पहले -->
    <label for="examUrl">Response Sheet / Answer Key URL</label>
    <input
      id="examUrl"
      type="url"
      placeholder="अपना Exam URL यहाँ डालें"
      required
    >

    <p class="hint">
      अपनी परीक्षा का वैध URL डालें।
    </p>

    <label for="exam">Select Railway Exam</label>
    <select id="exam" required>
      <option value="">-- परीक्षा चुनें --</option>
      <option>RRB ALP</option>
      <option>RRB Technician</option>
      <option>RRB Group D</option>
      <option>RRB NTPC Graduate</option>
      <option>RRB NTPC Undergraduate</option>
      <option>RRB JE</option>
      <option>GDCE ALP</option>
      <option>GDCE Technician</option>
      <option>GDCE Goods Guard / Train Manager</option>
      <option>GDCE Station Master</option>
      <option>LDCE Station Master</option>
      <option>LDCE Goods Guard / Train Manager</option>
      <option>LDCE CCTC</option>
      <option>Other Railway Exam</option>
    </select>

    <label for="candidateName">Candidate Name</label>
    <input
      id="candidateName"
      type="text"
      maxlength="100"
      placeholder="अपना नाम लिखें"
      required
    >

    <label for="registration">Registration Number</label>
    <input
      id="registration"
      type="text"
      maxlength="50"
      placeholder="Registration Number डालें"
      required
    >

    <button type="submit" id="calculateBtn">
      CALCULATE SCORE
    </button>

  </form>

  <div id="status" class="status" role="status"
       aria-live="polite"></div>
</section>

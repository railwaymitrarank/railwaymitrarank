<script>
"use strict";

/* =========================
   PAGE NAVIGATION
========================= */

function showPage(id, btn) {
  document.querySelectorAll(".page").forEach(p => {
    p.classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");

  document.querySelectorAll("nav button").forEach(b => {
    b.classList.remove("active");
  });

  btn.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}


/* =========================
   SAFE TEXT
========================= */

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

function blank(value) {
  if (value === null || value === undefined) return true;

  return /^(|--|na|n\/a|not answered|not attempted|-|none)$/i
    .test(String(value).trim());
}


/* =========================
   FIELD NAME MATCHING
========================= */

function getField(row, names) {
  if (!row || typeof row !== "object") return "";

  const keys = Object.keys(row);

  for (const name of names) {
    const wanted = name.toLowerCase().replace(/[^a-z0-9]/g, "");

    const key = keys.find(k =>
      k.toLowerCase().replace(/[^a-z0-9]/g, "") === wanted
    );

    if (key !== undefined &&
        row[key] !== null &&
        row[key] !== undefined) {
      return String(row[key]).trim();
    }
  }

  return "";
}

const ID_FIELDS = [
  "id",
  "questionId",
  "question_id",
  "qid",
  "questionNo",
  "questionNumber",
  "question_number",
  "srNo",
  "serialNumber"
];

const KEY_FIELDS = [
  "correctAnswer",
  "correct_answer",
  "correctOption",
  "correct_option",
  "officialAnswer",
  "official_answer",
  "answerKey",
  "answer_key",
  "answer",
  "rightAnswer",
  "right_answer",
  "correctResponse"
];

const RESPONSE_FIELDS = [
  "candidateAnswer",
  "candidate_answer",
  "chosenOption",
  "chosen_option",
  "selectedAnswer",
  "selected_answer",
  "response",
  "yourAnswer",
  "your_answer",
  "candidateResponse",
  "candidate_response",
  "markedAnswer",
  "marked_answer",
  "selectedOption",
  "selected_option"
];


/* =========================
   ANSWER NORMALIZATION
========================= */

function normalizeAnswer(value) {
  return String(value ?? "")
    .normalize("NFKC")
    .trim()
    .toLowerCase()
    .replace(/^option\s*/i, "")
    .replace(/^ विकल्प\s*/i, "")
    .replace(/[\s().]/g, "");
}

function normalizeId(value) {
  return String(value ?? "").trim();
}


/* =========================
   CSV READER
========================= */

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");

  const rows = [];
  let row = [];
  let value = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];

    if (ch === '"' && quoted && text[i + 1] === '"') {
      value += '"';
      i++;
    } else if (ch === '"') {
      quoted = !quoted;
    } else if (ch === "," && !quoted) {
      row.push(value.trim());
      value = "";
    } else if ((ch === "\n" || ch === "\r") && !quoted) {
      if (ch === "\r" && text[i + 1] === "\n") i++;

      row.push(value.trim());

      if (row.some(v => v !== "")) rows.push(row);

      row = [];
      value = "";
    } else {
      value += ch;
    }
  }

  row.push(value.trim());

  if (row.some(v => v !== "")) rows.push(row);

  if (rows.length < 2) {
    throw Error("CSV में Header और प्रश्नों का डेटा नहीं मिला।");
  }

  const headers = rows[0].map(h => h.trim());

  return rows.slice(1).map(cells => {
    const result = {};

    headers.forEach((header, index) => {
      result[header] = cells[index] ?? "";
    });

    return result;
  });
}


/* =========================
   JSON / CSV FILE READER
========================= */

async function readRows(file) {
  const text = await file.text();
  const filename = file.name.toLowerCase();

  if (filename.endsWith(".json") ||
      text.trim().startsWith("[") ||
      text.trim().startsWith("{")) {

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw Error("JSON फ़ाइल पढ़ी नहीं जा सकी।");
    }

    if (Array.isArray(data)) return data;

    if (data && Array.isArray(data.questions)) {
      return data.questions;
    }

    if (data && Array.isArray(data.data)) {
      return data.data;
    }

    if (data && Array.isArray(data.items)) {
      return data.items;
    }

    throw Error("JSON में प्रश्नों की सूची नहीं मिली।");
  }

  if (filename.endsWith(".csv") || text.includes(",")) {
    return parseCSV(text);
  }

  throw Error("यह फाइल समर्थित नहीं है। CSV या JSON चुनें।");
}


/* =========================
   SCORE CALCULATOR
========================= */

async function calculateScore(type) {
  const isLDCE = type === "ldce";

  const prefix = isLDCE ? "ldce" : "rrb";

  const errorBox = document.getElementById(prefix + "Error");
  const resultBox = document.getElementById(prefix + "Result");

  errorBox.innerHTML = "";
  resultBox.innerHTML = "";

  try {
    const keyInput = document.getElementById(
      isLDCE ? "ldceKey" : "rrbKey"
    );

    const responseInput = document.getElementById(
      isLDCE ? "ldceResponse" : "rrbResponse"
    );

    const keyFile = keyInput.files[0];
    const responseFile = responseInput.files[0];

    if (!keyFile) {
      throw Error("पहले Official Answer Key की फाइल चुनें।");
    }

    if (!responseFile) {
      throw Error("अब Candidate Response की फाइल चुनें।");
    }

    const positive = Number(document.getElementById(
      isLDCE ? "ldcePositive" : "rrbPositive"
    ).value);

    const negative = Number(document.getElementById(
      isLDCE ? "ldceNegative" : "rrbNegative"
    ).value);

    if (!Number.isFinite(positive) || positive < 0 ||
        !Number.isFinite(negative) || negative < 0) {
      throw Error("सही और गलत उत्तर के अंक जाँचें।");
    }

    const keyRows = await readRows(keyFile);
    const responseRows = await readRows(responseFile);

    if (!keyRows.length || !responseRows.length) {
      throw Error("फाइल में प्रश्नों का डेटा नहीं मिला।");
    }

    const answerMap = new Map();

    /* Official answer key read */

    for (let i = 0; i < keyRows.length; i++) {
      const row = keyRows[i];

      const id = normalizeId(getField(row, ID_FIELDS));
      const answer = getField(row, KEY_FIELDS);

      if (!id || blank(answer)) {
        throw Error(
          "Answer Key की पंक्ति " + (i + 2) +
          " में Question ID या सही उत्तर नहीं मिला।"
        );
      }

      if (answerMap.has(id)) {
        throw Error("Answer Key में दोहराया गया Question ID: " + id);
      }

      answerMap.set(id, normalizeAnswer(answer));
    }

    let correct = 0;
    let wrong = 0;
    let unattempted = 0;

    const seen = new Set();

    /* Candidate response read and matching */

    for (let i = 0; i < responseRows.length; i++) {
      const row = responseRows[i];

      const id = normalizeId(getField(row, ID_FIELDS));
      const candidateAnswer = getField(row, RESPONSE_FIELDS);

      if (!id) {
        throw Error(
          "Candidate Response की पंक्ति " + (i + 2) +
          " में Question ID नहीं मिली।"
        );
      }

      if (seen.has(id)) {
        throw Error("Response में दोहराया गया Question ID: " + id);
      }

      seen.add(id);

      if (!answerMap.has(id)) {
        throw Error(
          "Question ID " + id +
          " Answer Key में नहीं मिली। दोनों फाइलों की जाँच करें।"
        );
      }

      if (blank(candidateAnswer)) {
        unattempted++;
        continue;
      }

      const officialAnswer = answerMap.get(id);
      const selectedAnswer = normalizeAnswer(candidateAnswer);

      if (selectedAnswer === officialAnswer) {
        correct++;
      } else {
        wrong++;
      }
    }

    if (seen.size !== answerMap.size) {
      throw Error(
        "Answer Key और Response में प्रश्नों की संख्या अलग है। " +
        "सभी प्रश्नों का मिलान नहीं हुआ, इसलिए स्कोर नहीं निकाला गया।"
      );
    }

    const total = answerMap.size;
    const attempted = correct + wrong;
    const score = correct * positive - wrong * negative;

    const accuracy = attempted > 0
      ? (correct / attempted) * 100
      : 0;

    let details = "";

    if (isLDCE) {
      details =
        "<p><b>Zone:</b> " +
        esc(document.getElementById("ldceZone").value) + "</p>" +

        "<p><b>Division:</b> " +
        esc(document.getElementById("ldceDivision").value) + "</p>" +

        "<p><b>Exam/Post:</b> " +
        esc(document.getElementById("ldcePost").value) + "</p>";
    } else {
      details =
        "<p><b>Exam:</b> " +
        esc(document.getElementById("examType").value) + "</p>" +

        "<p><b>Post:</b> " +
        esc(document.getElementById("examPost").value) + "</p>" +

        "<p><b>Zone:</b> " +
        esc(document.getElementById("zone").value) + "</p>" +

        "<p><b>Date:</b> " +
        esc(document.getElementById("examDate").value) + "</p>" +

        "<p><b>Shift:</b> " +
        esc(document.getElementById("shift").value) + "</p>" +

        "<p><b>Category:</b> " +
        esc(document.getElementById("category").value) + "</p>";
    }

    const candidateName = document.getElementById(
      isLDCE ? "ldceName" : "candidateName"
    ).value;

    resultBox.innerHTML =
      '<div class="result">' +
      '<h3>📊 Score Card</h3>' +

      '<p><b>Candidate:</b> ' + esc(candidateName) + '</p>' +
      details +

      '<table>' +
      '<tr><th>विवरण</th><th>रिजल्ट</th></tr>' +
      '<tr><td>Total Questions</td><td>' + total + '</td></tr>' +
      '<tr><td>Attempted</td><td>' + attempted + '</td></tr>' +
      '<tr><td>Correct</td><td>' + correct + '</td></tr>' +
      '<tr><td>Wrong</td><td>' + wrong + '</td></tr>' +
      '<tr><td>Unattempted</td><td>' + unattempted + '</td></tr>' +
      '<tr><td>Accuracy</td><td>' + accuracy.toFixed(2) + '%</td></tr>' +
      '<tr><th>Total Score</th><th>' + score.toFixed(2) + '</th></tr>' +
      '</table>' +

      '<p class="small">स्कोर चुनी गई Answer Key और Response के मिलान से निकाला गया है। परीक्षा के आधिकारिक अंक नियमों की पुष्टि करें।</p>' +

      '<button class="main full no-print" onclick="window.print()">' +
      'SAVE SCORE CARD PDF</button>' +

      '</div>';

  } catch (error) {
    errorBox.innerHTML =
      '<div class="error"><b>स्कोर नहीं निकला:</b><br>' +
      esc(error.message || "फाइल पढ़ने में समस्या हुई।") +
      '</div>';
  }
}


/* =========================
   RANK PREDICTOR
========================= */

function predictRank() {
  const marksValue = document.getElementById("rankMarks").value;
  const candidatesValue = document.getElementById("totalCandidates").value;
  const percentileValue = document.getElementById("rankPercentile").value;

  const output = document.getElementById("rankResult");
  output.innerHTML = "";

  const marks = Number(marksValue);
  const total = Number(candidatesValue);

  if (marksValue === "" || candidatesValue === "" ||
      !Number.isFinite(marks) || marks < 0 ||
      !Number.isInteger(total) || total < 1) {
    output.innerHTML =
      '<div class="error">Marks और Total Candidates सही भरें।</div>';
    return;
  }

  if (percentileValue === "") {
    output.innerHTML =
      '<div class="note">विश्वसनीय अनुमान के लिए Percentile भरें।</div>';
    return;
  }

  const percentile = Number(percentileValue);

  if (!Number.isFinite(percentile) ||
      percentile < 0 || percentile > 100) {
    output.innerHTML =
      '<div class="error">Percentile 0 से 100 के बीच भरें।</div>';
    return;
  }

  const rank = Math.min(
    total,
    Math.max(1, Math.ceil(total * (100 - percentile) / 100))
  );

  output.innerHTML =
    '<div class="result">' +
    '<h3>Estimated Rank</h3>' +
    '<p><b>Marks:</b> ' + marks + '</p>' +
    '<p><b>Percentile:</b> ' + percentile.toFixed(2) + '%</p>' +
    '<p><b>Total Candidates:</b> ' +
    total.toLocaleString("en-IN") + '</p>' +
    '<p><b>अनुमानित Rank:</b> ' +
    rank.toLocaleString("en-IN") + '</p>' +
    '<p class="small">यह अनुमान है, आधिकारिक रैंक नहीं।</p>' +
    '</div>';
}
</script>

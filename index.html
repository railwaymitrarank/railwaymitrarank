<script>
const POSITIVE_MARKS = 1;
const NEGATIVE_MARKS = 0.33;

function checkAnswerKeyChoice() {
  const url = document.getElementById("answerUrl").value.trim();
  const file = document.getElementById("answerFile").files[0];

  if (Boolean(url) === Boolean(file)) {
    document.getElementById("status").textContent =
      "Please select either URL or HTML file.";
    return false;
  }

  return true;
}

function saveDetails() {
  const status = document.getElementById("status");
  status.textContent = "";

  if (!checkAnswerKeyChoice()) return;

  const details = {
    name: document.getElementById("candidateName").value,
    roll: document.getElementById("rollNumber").value,
    exam: document.getElementById("examName").value,
    zone: document.getElementById("zone").value,
    date: document.getElementById("examDate").value,
    shift: document.getElementById("shift").value,
    category: document.getElementById("category").value,
    answerUrl: document.getElementById("answerUrl").value.trim()
  };

  localStorage.setItem(
    "rrmCandidateDetails",
    JSON.stringify(details)
  );

  status.textContent = "Details saved.";
}

function parseAnswers(text) {
  const answers = {};

  text.split(/\n|,/).forEach(line => {
    const match = line.trim().match(
      /(?:Q(?:uestion)?\s*)?(\d+)\s*[-:=.)]\s*([A-E])/i
    );

    if (match) {
      answers[Number(match[1])] = match[2].toUpperCase();
    }
  });

  return answers;
}

function parseAnswerKey(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const key = {};

  doc.querySelectorAll("tr").forEach(row => {
    const cells = Array.from(row.querySelectorAll("th,td"))
      .map(cell => cell.innerText.trim());

    if (cells.length < 2) return;

    const q = cells.find(value => /^\d+$/.test(value));
    const a = cells.find(value => /^[A-E]$/i.test(value));

    if (q && a) {
      key[Number(q)] = a.toUpperCase();
    }
  });

  return key;
}

async function calculateScore() {
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  status.textContent = "";
  result.style.display = "none";
  result.innerHTML = "";

  if (!checkAnswerKeyChoice()) return;

  const candidateText =
    document.getElementById("candidateAnswers").value.trim();

  if (!candidateText) {
    status.textContent = "Answers required";
    return;
  }

  const file = document.getElementById("answerFile").files[0];
  const url = document.getElementById("answerUrl").value.trim();

  try {
    let html = "";

    if (file) {
      html = await file.text();
    } else {
      const response = await fetch(url);

      if (!response.ok) throw new Error();

      html = await response.text();
    }

    const correctAnswers = parseAnswerKey(html);
    const candidateAnswers = parseAnswers(candidateText);
    const questions = Object.keys(correctAnswers);

    if (questions.length === 0) {
      status.textContent = "Answer key format not supported";
      return;
    }

    let correct = 0;
    let wrong = 0;
    let unanswered = 0;

    questions.forEach(question => {
      const selected = candidateAnswers[Number(question)];

      if (!selected) {
        unanswered++;
      } else if (selected === correctAnswers[question]) {
        correct++;
      } else {
        wrong++;
      }
    });

    const score =
      correct * POSITIVE_MARKS - wrong * NEGATIVE_MARKS;

    result.innerHTML = `
      <h2>Score Result</h2>
      <p><strong>Total Questions:</strong> ${questions.length}</p>
      <p><strong>Correct:</strong> ${correct}</p>
      <p><strong>Wrong:</strong> ${wrong}</p>
      <p><strong>Unanswered:</strong> ${unanswered}</p>
      <p><strong>Score:</strong> ${score.toFixed(2)}</p>
    `;

    result.style.display = "block";

  } catch (error) {
    status.textContent = "Answer key unavailable";
  }
}
